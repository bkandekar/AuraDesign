<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Page Not Found &bull; Webora</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="nav-container" aria-label="Main Navigation">
        <a href="index.html" class="brand-logo" aria-label="Webora Home">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#09090B"/>
            <path d="M7 10L11.5 22L16 13L20.5 22L25 10" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="7.5" r="2" fill="#2563EB"/>
          </svg>
          <span>WEBORA</span>
        </a>

        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="index.html" class="btn btn-primary btn-sm">Return Home &rarr;</a>
        </div>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; text-align: center;">
    <div class="container container-narrow reveal">
      <span class="tagline">404 Error</span>
      <h1 style="font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; line-height: 1; margin: 1rem 0; letter-spacing: -0.05em;" class="gradient-text">Lost in Space</h1>
      <p style="font-size: var(--fs-lg); color: var(--text-secondary); max-width: 500px; margin: 0 auto 2rem;">The page you are looking for has been relocated, renamed, or never existed in the first place.</p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-blue">Back to Home</a>
        <a href="services.html" class="btn btn-secondary">Explore Services</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 Webora Digital Agency. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
